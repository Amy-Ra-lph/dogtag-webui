include:
  - project: 'afarley/ai-tool-security-check'
    file: '/ci/trivy.yml'
    ref: main

stages:
  - validate
  - test
  - build
  - scan

default:
  image: node:22-alpine

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

install:
  stage: validate
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: validate
  needs: [install]
  script:
    - npx eslint .

typecheck:
  stage: validate
  needs: [install]
  script:
    - npx tsc --noEmit

test:
  stage: test
  needs: [install]
  script:
    - npx vitest run --reporter=verbose
  coverage: '/All files\s+\|\s+(\d+\.?\d*)\s/'

build:
  stage: build
  needs: [lint, typecheck, test]
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

container:
  stage: build
  needs: [build]
  image: quay.io/podman/stable:latest
  script:
    - podman build -t dogtag-webui .
    - podman save -o image.tar dogtag-webui
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
